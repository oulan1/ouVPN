name: Update ouVPN Subscription

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run server updater
        run: python update_configs.py

      - name: Commit and Push ouvpn.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ouvpn.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ouVPN servers [skip ci]" && git push)
