name: "2. Обновление только РАБОЧИХ серверов (с пингом)"

on:
  schedule:
    # Запуск каждые 2 часа в 40 минут (смещение от обычного крона для избежания очередей)
    - cron: '40 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-verified:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verified server updater
        run: |
          python update_verified.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ouvpn.txt
          if git diff --staged --quiet; then
            echo "Изменений нет, коммит не требуется."
          else
            git commit -m "Автообновление рабочих серверов ouVPN (с пингом) [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
